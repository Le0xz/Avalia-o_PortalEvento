<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Acadêmicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- É o início da barra de navegação (Navbar), navbar-expand-lg: expande o menu em telas grandes; 
 bg-danger: fundo vermelho; navbar-light: ajusta os textos para cores claras -->
<nav class="navbar navbar-expand-lg bg-danger navbar-light">
    <!-- Container para centralizar e alinhar o conteúdo da barra -->
    <div class="container">
        
        <!-- O logotipo ou Título principal do site,
atributo data-view="dashboard" é usado pelo JavaScript para carregar a tela inicial -->
        <a class="navbar-brand" href="#" data-view="dashboard">
            Portal de Eventos
        </a>

        <!-- Botão "hambúrguer" que aparece para as versões de dispositivos móveis (celulares/tablets) para abrir/fechar o menu (encontrado em w3schools)-->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Container colapsável que agrupa os links do menu, O id="menu" faz o link com o botãotoggler acima -->
        <div class="collapse navbar-collapse" id="menu">
            <!-- Lista de navegação (ms-auto empurra os itens para o lado direito da tela) -->
            <ul class="navbar-nav ms-auto">
                
                <!-- Item do menu: Dashboard -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-view="dashboard">Dashboard</a>
                </li>
                
                <!-- Item do menu: Cadastro/Criação de Evento -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-view="novo">Evento</a>
                </li>
                
                <!-- Item do menu: Listagem de Eventos -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-view="eventos">Eventos</a>
                </li>
                
            </ul>
        </div>
    </div>
</nav>

<!-- Área principal da aplicação onde o conteúdo (como o dashboard ou os cards) será injetado dinamicamente via JavaScript -->
<!-- id="app" conecta com o CSS; container centraliza; py-4 adiciona espaçamento vertical (padding) -->
<main id="app" class="container py-4"></main>

<!-- Necessário para o menu responsivo funcionar no celular -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script principal onde a lógica dos cliques, rotas e dados dos eventos é controlada -->
<script src="js/app.js"></script>

</body>
</html>
